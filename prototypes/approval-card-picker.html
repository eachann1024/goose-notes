<!doctype html>
<!--
  THROW AWAY PROTOTYPE.
  Question: 审批卡不要预览、不要说明、不要线条，但要比现在更大气。哪个结构对？
  打开本文件，底部栏 / 左右方向键切 A B C。用完即弃，不进生产。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>审批卡选型 · A / B / C</title>
    <style>
      :root {
        --shell: #f4f4f4;
        --paper: #ffffff;
        --ink: #1f1f1f;
        --ink-2: #6e6e6e;
        --ink-3: #9a9a9a;
        --line: #e8e7e5;
        --subtle: #f3f2f1;
        --hover: #ebeae8;
        --primary: #171717;
        --primary-fg: #ffffff;
        --user-bubble: rgba(88, 215, 184, 0.12);
        --success: #16a34a;
        --shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--shell);
        color: var(--ink);
        font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .stage {
        min-height: 100vh;
        display: flex;
        align-items: stretch;
        justify-content: center;
        padding: 28px 20px 120px;
      }
      .panel {
        width: min(420px, 100%);
        background: var(--paper);
        border-radius: 18px;
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-head {
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        color: var(--ink-2);
        font-size: 13px;
      }
      .panel-head strong {
        color: var(--ink);
        font-weight: 600;
      }
      .messages {
        flex: 1;
        padding: 18px 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .time {
        align-self: center;
        font-size: 12px;
        color: var(--ink-3);
      }
      .user {
        align-self: flex-end;
        max-width: 86%;
        background: var(--user-bubble);
        border-radius: 14px 4px 14px 14px;
        padding: 10px 12px;
        font-size: 13px;
        line-height: 1.55;
      }
      .composer {
        margin: 0 16px 16px;
        border: 1px solid var(--line);
        background: var(--subtle);
        border-radius: 12px;
        padding: 12px 12px 10px;
        color: var(--ink-3);
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .send {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-fg);
      }
      .meta {
        margin: 0 16px 10px;
        font-size: 12px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
      }

      /* A 横幅确认：一行标题，一行大按钮 */
      .a-card {
        background: var(--subtle);
        border-radius: 16px;
        padding: 18px 18px 16px;
      }
      .a-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .a-title {
        margin: 0;
        font-size: 16px;
        font-weight: 620;
        letter-spacing: -0.03em;
        line-height: 1.3;
      }
      .a-status {
        flex-shrink: 0;
        font-size: 12px;
        color: var(--ink-2);
      }
      .a-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }
      .ghost {
        height: 38px;
        border: 0;
        border-radius: 12px;
        padding: 0 16px;
        background: var(--paper);
        color: var(--ink);
      }
      .solid {
        height: 38px;
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        background: var(--primary);
        color: var(--primary-fg);
        font-weight: 600;
      }

      /* B 决策页：标题主导，双按钮等宽铺满 */
      .b-card {
        background: var(--paper);
        border-radius: 20px;
        padding: 22px 20px 18px;
        box-shadow:
          inset 0 0 0 1px var(--subtle),
          var(--shadow);
      }
      .b-kicker {
        margin: 0 0 8px;
        font-size: 12px;
        color: var(--ink-3);
        letter-spacing: 0.08em;
      }
      .b-title {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1.25;
      }
      .b-actions {
        display: grid;
        grid-template-columns: 1fr 1.2fr;
        gap: 10px;
        margin-top: 22px;
      }
      .b-ghost {
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: var(--subtle);
        color: var(--ink);
        font-size: 15px;
      }
      .b-solid {
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 15px;
        font-weight: 620;
      }

      /* C 输入条孪生：左文案，右大同意圆钮 */
      .c-card {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 72px;
        padding: 14px 14px 14px 18px;
        border-radius: 16px;
        background: var(--subtle);
      }
      .c-copy {
        min-width: 0;
        flex: 1;
      }
      .c-status {
        margin: 0 0 4px;
        font-size: 12px;
        color: var(--ink-2);
      }
      .c-title {
        margin: 0;
        font-size: 15px;
        font-weight: 620;
        letter-spacing: -0.03em;
        line-height: 1.3;
      }
      .c-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .c-cancel {
        height: 40px;
        border: 0;
        border-radius: 999px;
        padding: 0 14px;
        background: transparent;
        color: var(--ink-2);
      }
      .c-ok {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-fg);
        font-size: 13px;
        font-weight: 650;
      }

      .done {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 10px;
        color: var(--ink-2);
        font-size: 13px;
      }
      .done button {
        height: 34px;
        border: 0;
        border-radius: 999px;
        padding: 0 14px;
        background: var(--paper);
        color: var(--ink);
      }
      .b-card .done {
        margin-top: 16px;
      }
      .c-done {
        margin-top: 0;
        min-height: 72px;
        padding: 14px 18px;
        border-radius: 16px;
        background: var(--subtle);
      }

      .switcher {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 999px;
        background: #111;
        color: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        z-index: 20;
      }
      .switcher button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 999px;
        background: #2a2a2a;
        color: #fff;
      }
      .switcher b {
        min-width: 168px;
        text-align: center;
        font-size: 13px;
      }
      .hint {
        position: fixed;
        left: 20px;
        bottom: 28px;
        max-width: 280px;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <section class="panel" aria-label="AI 面板示意">
        <div class="panel-head">
          <strong>AI</strong>
          <span>全屏会话</span>
        </div>
        <p class="meta" id="label"></p>
        <div class="messages">
          <div class="time">10:38</div>
          <div class="user">把这篇健康作息文案改成更紧凑的小红书风格</div>
          <div id="card"></div>
        </div>
        <div class="composer">
          <span>写入到当前笔记</span>
          <button class="send" type="button" tabindex="-1">↑</button>
        </div>
      </section>
    </div>

    <p class="hint">
      三个方案都没有预览、说明和线条。<br />
      看的是留白、字号和按钮气势。
    </p>
    <nav class="switcher" aria-label="方案切换">
      <button type="button" id="prev" aria-label="上一个">←</button>
      <b id="switch-label"></b>
      <button type="button" id="next" aria-label="下一个">→</button>
    </nav>

    <script>
      const VARIANTS = [
        {
          key: "A",
          name: "横幅确认",
          desc: "标题一行，按钮一行，浅底大圆角",
          html: `
            <article class="a-card">
              <div class="a-top">
                <h2 class="a-title">精简健康作息文案</h2>
                <span class="a-status">等待同意</span>
              </div>
              <div class="a-actions">
                <button class="ghost" type="button">取消</button>
                <button class="solid" type="button">同意</button>
              </div>
            </article>
            <div class="done">
              <span>已更改</span>
              <button type="button">撤回</button>
            </div>
          `,
        },
        {
          key: "B",
          name: "决策页",
          desc: "大标题 + 等宽双按钮，更像确认动作",
          html: `
            <article class="b-card">
              <p class="b-kicker">等待同意</p>
              <h2 class="b-title">精简健康作息文案</h2>
              <div class="b-actions">
                <button class="b-ghost" type="button">取消</button>
                <button class="b-solid" type="button">同意</button>
              </div>
            </article>
            <div class="done">
              <span>已更改</span>
              <button type="button">撤回</button>
            </div>
          `,
        },
        {
          key: "C",
          name: "发送条孪生",
          desc: "左文案右大圆钮，贴齐底部输入条",
          html: `
            <article class="c-card">
              <div class="c-copy">
                <p class="c-status">等待同意</p>
                <h2 class="c-title">精简健康作息文案</h2>
              </div>
              <div class="c-actions">
                <button class="c-cancel" type="button">取消</button>
                <button class="c-ok" type="button">同意</button>
              </div>
            </article>
            <div class="done c-done">
              <span>已更改</span>
              <button type="button">撤回</button>
            </div>
          `,
        },
      ];

      const params = new URLSearchParams(location.search);
      let index = Math.max(
        0,
        VARIANTS.findIndex(
          (item) => item.key === (params.get("variant") || "A"),
        ),
      );
      if (index < 0) index = 0;

      const card = document.getElementById("card");
      const label = document.getElementById("label");
      const switchLabel = document.getElementById("switch-label");

      function render() {
        const variant = VARIANTS[index];
        card.innerHTML = variant.html;
        label.textContent = `${variant.key} · ${variant.desc}`;
        switchLabel.textContent = `${variant.key} — ${variant.name}`;
        const next = new URL(location.href);
        next.searchParams.set("variant", variant.key);
        history.replaceState(null, "", next);
      }

      function cycle(delta) {
        index = (index + delta + VARIANTS.length) % VARIANTS.length;
        render();
      }

      document.getElementById("prev").onclick = () => cycle(-1);
      document.getElementById("next").onclick = () => cycle(1);
      window.addEventListener("keydown", (event) => {
        const tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        if (event.key === "ArrowLeft") cycle(-1);
        if (event.key === "ArrowRight") cycle(1);
      });
      render();
    </script>
  </body>
</html>
