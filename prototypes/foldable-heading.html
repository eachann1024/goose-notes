<!doctype html>
<!--
  THROW AWAY PROTOTYPE.
  Question: 所有标题都能折叠时，子内容怎样表达「属于这个标题」，
  又不画左侧引用竖线（看起来像 tab / 引用块）？
  已选定 C：整行标题条、收起显示摘要、正文顶格、不画引用线。
  四个变体仍可对照。?variant=current|A|B|C。用完即弃，不进生产。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>折叠标题选型 · 现状 / A / B / C</title>
    <style>
      :root {
        --bg: #f4f3f0;
        --paper: #ffffff;
        --ink: #1c1c1c;
        --ink-2: #6b6b6b;
        --ink-3: #9a9a9a;
        --line: #e4e3e0;
        --rail: #d8d6d2;
        --hover: #f1f0ed;
        --chip: #eef2ff;
        --chip-ink: #4f46e5;
        --code: #eef2ff;
        --code-ink: #4f46e5;
        --shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
      }
      [data-theme="dark"] {
        --bg: #232322;
        --paper: #2f2f2d;
        --ink: #ececec;
        --ink-2: #a8a8a8;
        --ink-3: #7a7a7a;
        --line: #3d3d3b;
        --rail: #4a4a47;
        --hover: #3a3a37;
        --chip: #3d3e64;
        --chip-ink: #c7d2fe;
        --code: #3d3e64;
        --code-ink: #c7d2fe;
        --shadow:
          0 0 0 1px rgba(255, 255, 255, 0.04), 0 16px 36px rgba(0, 0, 0, 0.42);
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }

      .brief {
        max-width: 720px;
        margin: 0 auto;
        padding: 28px 28px 0;
      }
      .brief h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 650;
      }
      .brief p {
        margin: 0 0 8px;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1.6;
      }
      .brief b {
        color: var(--ink);
        font-weight: 600;
      }

      .paper {
        max-width: 720px;
        margin: 16px auto 220px;
        background: var(--paper);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 56px 72px 72px;
      }

      .editor {
        font-size: 16px;
        line-height: 1.7;
      }

      /* ---------- 共享：折叠块 ---------- */
      .fold-body {
        display: block;
      }
      .fold[data-open="false"] > .fold-body {
        display: none;
      }

      .chev {
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        border-radius: 6px;
        color: var(--ink-2);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .chev svg {
        width: 14px;
        height: 14px;
        transform: rotate(0deg);
      }
      .fold[data-open="true"] > .fold-head .chev svg {
        transform: rotate(90deg);
      }
      .chev:hover,
      .fold-head:focus-visible .chev {
        background: var(--hover);
        color: var(--ink);
      }
      .fold-head:focus-visible {
        outline: 2px solid var(--chip-ink);
        outline-offset: 2px;
        border-radius: 6px;
      }

      .h1 {
        font-size: 32px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .h2 {
        font-size: 18px;
        font-weight: 650;
        line-height: 1.4;
      }
      .toggle-title {
        font-size: 16px;
        font-weight: 500;
      }

      .ol {
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: item;
      }
      .ol li {
        position: relative;
        padding-left: 1.6em;
        margin: 0 0 2px;
        counter-increment: item;
      }
      .ol li::before {
        content: counter(item) ".";
        position: absolute;
        left: 0;
        color: var(--ink-2);
        font-variant-numeric: tabular-nums;
      }

      .p {
        margin: 0 0 10px;
      }
      .blank {
        height: 1.7em;
      }
      .outside {
        margin-top: 28px;
        color: var(--ink);
      }

      .mention,
      code {
        display: inline;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--chip);
        color: var(--chip-ink);
        font-size: 0.85em;
        line-height: 1.3;
      }
      code {
        font-family: "SF Mono", "DM Mono", Menlo, Consolas, monospace;
        margin: 0 0.15em;
      }

      .preview {
        display: none;
        color: var(--ink-3);
        font-size: 13px;
        font-weight: 400;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .count {
        display: none;
        color: var(--ink-3);
        font-size: 12px;
        font-weight: 500;
        flex: 0 0 auto;
      }

      /* ========== 现状：22px 缩进 + 引用竖线 ========== */
      [data-variant="current"] .fold-head {
        display: flex;
        align-items: center;
        gap: 4px;
        width: 100%;
        text-align: left;
        margin: 0.35em 0 0.2em;
      }
      [data-variant="current"] .fold-head .h1,
      [data-variant="current"] .fold-head .h2,
      [data-variant="current"] .fold-head .toggle-title {
        min-width: 0;
      }
      [data-variant="current"] .fold-body {
        position: relative;
        margin-left: 22px;
        padding-left: 0;
      }
      [data-variant="current"] .fold-body::before {
        content: "";
        position: absolute;
        left: -14px;
        top: 2px;
        bottom: 2px;
        width: 1px;
        border-radius: 1px;
        background: var(--rail);
      }
      [data-variant="current"] .nest {
        margin-top: 0.5em;
      }

      /* ========== A：齐平章节 · 箭头在 gutter · 零缩进无线 ========== */
      [data-variant="A"] .fold-head {
        position: relative;
        display: block;
        width: 100%;
        text-align: left;
        margin: 0.55em 0 0.28em;
      }
      [data-variant="A"] .fold[data-kind="toggle"] > .fold-head {
        display: flex;
        align-items: center;
        gap: 4px;
        margin: 0.2em 0;
      }
      [data-variant="A"] .fold[data-kind="heading"] > .fold-head .chev {
        position: absolute;
        left: -24px;
        top: 50%;
        margin-top: -10px;
      }
      [data-variant="A"]
        .fold[data-kind="heading"][data-open="true"]
        > .fold-head
        .chev {
        opacity: 0;
      }
      [data-variant="A"]
        .fold[data-kind="heading"][data-open="true"]
        > .fold-head:hover
        .chev,
      [data-variant="A"]
        .fold[data-kind="heading"][data-open="true"]
        > .fold-head:focus-visible
        .chev {
        opacity: 1;
      }
      [data-variant="A"] .fold-body {
        margin-left: 0;
      }
      [data-variant="A"] .nest {
        margin-top: 0.65em;
      }

      /* ========== B：轻缩进 · 用间距分组 · 不画竖线 ========== */
      [data-variant="B"] .fold-head {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        text-align: left;
        margin: 0.7em 0 0.35em;
      }
      [data-variant="B"] .fold-body {
        margin-left: 12px;
        padding-bottom: 0.35em;
      }
      [data-variant="B"] .nest {
        margin-top: 0.45em;
      }
      [data-variant="B"] .fold[data-kind="heading"] {
        margin-bottom: 0.4em;
      }

      /* ========== C：整行标题条 · 收起看摘要 · 正文顶格 ========== */
      [data-variant="C"] .fold-head {
        display: flex;
        align-items: center;
        gap: 8px;
        width: calc(100% + 16px);
        margin: 0.45em 0 0.2em -8px;
        padding: 6px 8px;
        border-radius: 8px;
        text-align: left;
      }
      [data-variant="C"] .fold-head:hover {
        background: var(--hover);
      }
      [data-variant="C"] .fold[data-open="false"] > .fold-head {
        background: var(--hover);
      }
      [data-variant="C"] .fold-head .h1,
      [data-variant="C"] .fold-head .h2,
      [data-variant="C"] .fold-head .toggle-title {
        flex: 0 1 auto;
        min-width: 0;
      }
      [data-variant="C"] .fold[data-open="false"] > .fold-head .preview,
      [data-variant="C"] .fold[data-open="false"] > .fold-head .count {
        display: block;
      }
      [data-variant="C"] .fold-body {
        margin-left: 0;
        padding-left: 28px;
      }
      [data-variant="C"] .fold[data-kind="heading"] > .fold-body {
        padding-left: 0;
      }
      [data-variant="C"] .nest {
        margin-top: 0.55em;
      }

      /* ---------- 状态面板 / 切换栏 ---------- */
      .debug {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        width: min(320px, calc(100vw - 32px));
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 12px 14px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--ink-2);
      }
      .debug b {
        color: var(--ink);
        font-weight: 600;
      }
      .debug .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .debug button {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
        background: var(--paper);
      }
      .debug button:hover {
        background: var(--hover);
      }

      .variant-bar {
        position: fixed;
        left: 50%;
        bottom: 22px;
        z-index: 30;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        background: #171717;
        color: #f5f5f5;
        border-radius: 999px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
        font-size: 13px;
        user-select: none;
      }
      [data-theme="dark"] .variant-bar {
        background: #ececec;
        color: #171717;
      }
      .variant-bar button {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        color: inherit;
      }
      .variant-bar button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      [data-theme="dark"] .variant-bar button:hover {
        background: rgba(0, 0, 0, 0.08);
      }
      .variant-bar .label {
        min-width: 168px;
        text-align: center;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="brief">
      <h1>折叠标题要不要左侧那根「引用线」？</h1>
      <p>
        问题：所有标题都能折叠。展开后怎样看出子内容还在这个标题里，
        <b>又不画那根像 tab / 引用块的竖线</b>。
      </p>
      <p>
        现状是对照。A 齐平、B 轻缩进、C 整行条是三套结构不同的方案。点标题或箭头折叠，左右键切换变体。
      </p>
    </div>

    <div class="paper">
      <div class="editor" id="doc" data-variant="A"></div>
    </div>

    <div class="debug">
      <div>变体 <b id="dbg-variant">A</b></div>
      <div>缩进 <b id="dbg-indent">0</b> · 引用线 <b id="dbg-rail">无</b></div>
      <div>把手 <b id="dbg-handle">gutter，展开后悬停才显</b></div>
      <div>已收起 <b id="dbg-closed">无</b></div>
      <div class="row">
        <button type="button" data-fold="all-open">全部展开</button>
        <button type="button" data-fold="all-close">全部收起</button>
        <button type="button" data-fold="h1">只收 H1</button>
        <button type="button" id="theme-toggle">切换明暗</button>
      </div>
    </div>

    <div class="variant-bar">
      <button type="button" id="prev" aria-label="上一个">‹</button>
      <span class="label" id="variant-label">A · 齐平章节</span>
      <button type="button" id="next" aria-label="下一个">›</button>
    </div>

    <script>
      const VARIANTS = {
        current: {
          label: "现状 · 引用线",
          indent: "22px",
          rail: "有",
          handle: "行内箭头 + 子块竖线",
        },
        A: {
          label: "A · 齐平章节",
          indent: "0",
          rail: "无",
          handle: "gutter，展开后悬停才显",
        },
        B: {
          label: "B · 轻缩进",
          indent: "12px",
          rail: "无",
          handle: "行内箭头，用间距分组",
        },
        C: {
          label: "C · 整行标题条",
          indent: "正文顶格",
          rail: "无",
          handle: "整行可点，收起显示摘要",
        },
      };
      const ORDER = ["current", "A", "B", "C"];
      const TITLES = {
        h1: "权限体系",
        h2a: "超级管理员的特征",
        h2b: "平台运维角色",
        toggle: "部署备忘",
      };

      const chevron = `
        <span class="chev" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6" />
          </svg>
        </span>
      `;

      const doc = document.getElementById("doc");
      doc.innerHTML = `
        <section class="fold" data-id="h1" data-kind="heading" data-open="true" data-preview="超级管理员的特征…" data-count="2 节">
          <button type="button" class="fold-head" aria-expanded="true">
            ${chevron}
            <span class="h1">权限体系</span>
            <span class="preview">超级管理员的特征…</span>
            <span class="count">2 节</span>
          </button>
          <div class="fold-body">
            <section class="fold nest" data-id="h2a" data-kind="heading" data-open="true" data-preview="能进 系统菜单管理" data-count="3 条">
              <button type="button" class="fold-head" aria-expanded="true">
                ${chevron}
                <span class="h2">超级管理员的特征：</span>
                <span class="preview">能进 系统菜单管理</span>
                <span class="count">3 条</span>
              </button>
              <div class="fold-body">
                <ol class="ol">
                  <li>能进 <span class="mention">系统菜单管理</span></li>
                  <li>角色里勾选 <code>service.run.view</code></li>
                  <li>列表</li>
                </ol>
                <div class="blank" aria-hidden="true"></div>
              </div>
            </section>
            <section class="fold nest" data-id="h2b" data-kind="heading" data-open="true" data-preview="有平台账套 000000" data-count="1 条">
              <button type="button" class="fold-head" aria-expanded="true">
                ${chevron}
                <span class="h2">平台运维角色：</span>
                <span class="preview">有平台账套 000000</span>
                <span class="count">1 条</span>
              </button>
              <div class="fold-body">
                <ol class="ol">
                  <li>有平台账套 <code>000000</code> 并且是超级用户 <code>admin</code></li>
                </ol>
              </div>
            </section>
          </div>
        </section>
        <p class="outside p">这段普通正文不在任何折叠里，用来对照：展开后子内容会不会看起来「跑出去了」。</p>
        <section class="fold" data-id="toggle" data-kind="toggle" data-open="true" data-preview="改权限后要清缓存" data-count="2 行">
          <button type="button" class="fold-head" aria-expanded="true">
            ${chevron}
            <span class="toggle-title">部署备忘</span>
            <span class="preview">改权限后要清缓存</span>
            <span class="count">2 行</span>
          </button>
          <div class="fold-body">
            <p class="p">改权限后要清缓存。</p>
            <p class="p">否则菜单还是旧的。</p>
          </div>
        </section>
      `;

      let current = new URLSearchParams(location.search).get("variant");
      if (!VARIANTS[current]) current = "A";

      function closedIds() {
        return [...doc.querySelectorAll(".fold")]
          .filter((el) => el.dataset.open === "false")
          .map((el) => TITLES[el.dataset.id] || el.dataset.id);
      }

      function render() {
        doc.dataset.variant = current;
        const meta = VARIANTS[current];
        document.getElementById("variant-label").textContent = meta.label;
        document.getElementById("dbg-variant").textContent = current;
        document.getElementById("dbg-indent").textContent = meta.indent;
        document.getElementById("dbg-rail").textContent = meta.rail;
        document.getElementById("dbg-handle").textContent = meta.handle;
        const closed = closedIds();
        document.getElementById("dbg-closed").textContent =
          closed.length === 0 ? "无" : closed.join("、");
        const url = new URL(location.href);
        url.searchParams.set("variant", current);
        history.replaceState(null, "", url);
      }

      function setOpen(el, open) {
        el.dataset.open = open ? "true" : "false";
        const head = el.querySelector(":scope > .fold-head");
        if (head) head.setAttribute("aria-expanded", open ? "true" : "false");
      }

      doc.addEventListener("click", (e) => {
        const head = e.target.closest(".fold-head");
        if (!head || !doc.contains(head)) return;
        const fold = head.closest(".fold");
        if (!fold) return;
        setOpen(fold, fold.dataset.open !== "true");
        render();
      });

      document.querySelectorAll("[data-fold]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const mode = btn.dataset.fold;
          doc.querySelectorAll(".fold").forEach((el) => {
            if (mode === "all-open") setOpen(el, true);
            if (mode === "all-close") setOpen(el, false);
            if (mode === "h1") setOpen(el, el.dataset.id !== "h1");
          });
          render();
        });
      });

      document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.documentElement;
        html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
      });

      function step(dir) {
        const i = ORDER.indexOf(current);
        current = ORDER[(i + dir + ORDER.length) % ORDER.length];
        render();
      }
      document.getElementById("prev").addEventListener("click", () => step(-1));
      document.getElementById("next").addEventListener("click", () => step(1));
      document.addEventListener("keydown", (e) => {
        const t = e.target;
        if (
          t &&
          (t.tagName === "INPUT" ||
            t.tagName === "TEXTAREA" ||
            t.isContentEditable)
        )
          return;
        if (e.key === "ArrowRight") step(1);
        if (e.key === "ArrowLeft") step(-1);
      });

      render();
    </script>
  </body>
</html>
