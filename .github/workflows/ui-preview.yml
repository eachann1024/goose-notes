name: UI preview
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, closed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to preview
        required: true
        type: string
permissions: {}
concurrency:
  group: ui-preview-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true
jobs:
  detect:
    if: github.event.action != 'closed' && (github.event.action != 'labeled' || github.event.label.name == 'ui-preview')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    outputs:
      ui: ${{ steps.detect.outputs.ui }}
      sha: ${{ steps.detect.outputs.sha }}
      number: ${{ steps.detect.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ui-preview
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/ui-preview/publish.test.mjs
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUT_DIR: request
        run: node .github/ui-preview/publish.mjs detect
      - uses: actions/upload-artifact@v4
        if: steps.detect.outputs.ui == 'true'
        with:
          name: ui-request
          path: request/request.json
          retention-days: 3
  inspect:
    needs: detect
    if: needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ci/.github/ui-preview --ignore-scripts
      - run: bun install --frozen-lockfile
        working-directory: pr
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - run: node ci/.github/ui-preview/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build PR and inspect real page outlines (no secrets)
        run: node ci/.github/ui-preview/run.mjs inspect pr inspection
      - uses: actions/upload-artifact@v4
        with:
          name: ui-inspection
          path: inspection/inspection.json
          retention-days: 3
  plan:
    needs: [detect, inspect]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ui-request
          path: request
      - uses: actions/download-artifact@v4
        with:
          name: ui-inspection
          path: inspection
      # Only trusted default-branch planning code sees the model key.
      - name: Plan scenes from PR diff and real UI
        env:
          UI_PREVIEW_API_KEY: ${{ secrets.UI_PREVIEW_API_KEY }}
          UI_PREVIEW_API_URL: ${{ vars.UI_PREVIEW_API_URL }}
          UI_PREVIEW_MODEL: ${{ vars.UI_PREVIEW_MODEL }}
        run: node .github/ui-preview/plan.mjs request/request.json inspection/inspection.json plan/plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-plan
          path: plan/plan.json
          retention-days: 3
  record:
    needs: [detect, plan]
    uses: ./.github/workflows/ui-preview-record.yml
    with:
      sha: ${{ needs.detect.outputs.sha }}
      plan-artifact: ui-plan
      output-artifact: ui-preview
    permissions:
      contents: read
  repair:
    needs: [detect, inspect, record]
    if: always() && needs.record.result == 'failure' && needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: ui-request
          path: request
      - uses: actions/download-artifact@v4
        with:
          name: ui-inspection
          path: inspection
      - uses: actions/download-artifact@v4
        with:
          name: ui-preview
          path: failed
      - name: One bounded replan from the failed step and current outline
        env:
          UI_PREVIEW_API_KEY: ${{ secrets.UI_PREVIEW_API_KEY }}
          UI_PREVIEW_API_URL: ${{ vars.UI_PREVIEW_API_URL }}
          UI_PREVIEW_MODEL: ${{ vars.UI_PREVIEW_MODEL }}
        run: node .github/ui-preview/plan.mjs request/request.json inspection/inspection.json plan/plan.json failed/failure.json
      - uses: actions/upload-artifact@v4
        with:
          name: ui-repaired-plan
          path: plan/plan.json
          retention-days: 3
  retry:
    needs: [detect, repair]
    uses: ./.github/workflows/ui-preview-record.yml
    with:
      sha: ${{ needs.detect.outputs.sha }}
      plan-artifact: ui-repaired-plan
      output-artifact: ui-preview-retry
    permissions:
      contents: read
  publish:
    needs: [detect, record, retry]
    if: always() && needs.detect.outputs.ui == 'true' && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: needs.retry.result == 'success' || needs.retry.result == 'failure'
        continue-on-error: true
        with:
          name: ui-preview-retry
          path: out
      - uses: actions/download-artifact@v4
        if: needs.retry.result != 'success' && needs.retry.result != 'failure'
        continue-on-error: true
        with:
          name: ui-preview
          path: out
      - name: Publish PR media and replace its preview block
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.detect.outputs.number }}
          SHA: ${{ needs.detect.outputs.sha }}
          OUT_DIR: out
          RECORD_RESULT: ${{ needs.retry.result == 'success' && 'success' || needs.record.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs publish
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .github/ui-preview/publish.mjs cleanup
