name: Desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --prefix=goose-note-source/ HEAD > source-artifact/goose-note-source-${GITHUB_SHA}.tar.gz
          printf '%s\n' "$GITHUB_SHA" > source-artifact/COMMIT.txt
          cp BUILD-ARTIFACTS.md LICENSE SOURCE-CODE.md THIRD-PARTY-NOTICES.txt source-artifact/
          cd source-artifact
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: source-artifact/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-2022
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Compile renderer, main and preload
        run: bun run build:electron
      - name: Build unsigned installers and checksums
        run: node scripts/build-ci-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify Arch package installs with dependencies
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD/dist-desktop/ci:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /packages/*.pacman
            pacman -Q goose-note-app
            test -f "/opt/Goose Note/resources/app.asar"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goose-note-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist-desktop/ci/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  release:
    name: Publish development release
    needs: [source, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Verify and prepare release assets
        shell: bash
        run: |
          for directory in artifacts/*; do
            (cd "$directory" && sha256sum --check SHA256SUMS.txt)
          done
          python3 - <<'PY'
          import pathlib, shutil, hashlib
          out = pathlib.Path('release-assets')
          out.mkdir()
          for directory in pathlib.Path('artifacts').iterdir():
              prefix = directory.name.removesuffix('-' + '${{ github.sha }}')
              for file in directory.iterdir():
                  if file.name == 'SHA256SUMS.txt':
                      continue
                  installer = file.suffix in ['.exe', '.dmg', '.zip', '.AppImage', '.deb', '.rpm', '.pacman'] or file.name.endswith('.tar.gz')
                  name = file.name if installer else prefix + '-' + file.name
                  target = out / name.replace(' ', '.')
                  if target.exists():
                      raise RuntimeError('Duplicate asset: ' + target.name)
                  shutil.copyfile(file, target)
          (out / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + file.name + '\n'
              for file in sorted(out.iterdir())
          ))
          PY
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF_NOTES
          自动开发构建，提交：${GITHUB_SHA}

          Windows x64：exe；macOS Apple Silicon：arm64.dmg，Intel：无 arm64 后缀的 dmg；Linux x64：AppImage / deb / rpm；Arch Linux：pacman。

          本版本未签名，macOS 未公证。已通过多平台打包和 Arch 容器安装检查，未代替各平台桌面功能验收。
          附对应项目源码归档、构建记录与 SHA256SUMS.txt。依赖源码及第三方声明的公开分发核对事项见随附 SOURCE-CODE 文档。

          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF_NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "开发构建 ${GITHUB_SHA:0:7}" --notes-file release-notes.md --prerelease --draft --latest=false
          gh release upload "$tag" release-assets/*
          gh release edit "$tag" --draft=false

  publish-public:
    name: Publish public release
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: public-app-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish to public repository
        env:
          PUBLIC_APP_TOKEN: ${{ secrets.PUBLIC_APP_TOKEN }}
          PUBLIC_APP_REPO: eachann1024/goose-note-app
        run: node scripts/publish-public-app.mjs

