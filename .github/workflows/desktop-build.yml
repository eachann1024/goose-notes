name: Desktop installers

on:
  push:
    branches-ignore:
      # Generated preview media is an orphan branch, not application source.
      - ui-previews
  pull_request:
    branches: [main]
  schedule:
    # ponytail: GitHub cron 按月中日期隔日运行；月底可能连续两天，严格 48 小时需每日轻量检查。
    - cron: '0 7 */2 * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare:
    name: Select build and publication
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Skip unchanged scheduled builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            previous="${latest##*-}"
            if [[ "$previous" =~ ^[0-9a-f]{7}$ ]]; then
              changed=$(gh api "repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA" --jq '[.files[].filename | select(startswith("updates/") or startswith("Casks/") | not)] | length')
              if [[ "$changed" == 0 ]]; then
                echo 'build=false' >> "$GITHUB_OUTPUT"
                echo 'publish=false' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            if [[ "$latest" == *"-${GITHUB_SHA:0:7}" ]]; then
              echo 'build=false' >> "$GITHUB_OUTPUT"
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'build=true' >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/heads/main && ( "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi

  source:
    name: Source archive
    needs: [prepare]
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --prefix=goose-note-source/ HEAD > source-artifact/goose-note-source-${SOURCE_SHA}.tar.gz
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf '%s\n' "$SOURCE_SHA" > source-artifact/COMMIT.txt
          cp BUILD-ARTIFACTS.md LICENSE SOURCE-CODE.md THIRD-PARTY-NOTICES.txt source-artifact/
          cd source-artifact
          sha256sum *.tar.gz > source-${SOURCE_SHA}-SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ env.SOURCE_SHA }}
          path: source-artifact/
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [prepare]
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-2022
          # Cross-packaged on x64: the app ships no native modules, electron-builder fetches arm64 Electron.
          - platform: win
            arch: arm64
            runner: windows-2022
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    # Signed Windows publishing waits for manual SignPath approvals (two requests per architecture).
    timeout-minutes: ${{ matrix.platform == 'win' && needs.prepare.outputs.publish == 'true' && 180 || 45 }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Verify selected source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Verify packaging workflow regressions
        if: matrix.platform == 'linux'
        run: |
          bun tests/unit/releaseCadence.assert.ts
          node scripts/publish-release.mjs --self-test
          node scripts/signpath-config.mjs --self-test
          python3 -m unittest discover -s tests/unit -p 'build_processes_test.py'
      - name: Compile renderer, main and preload
        if: matrix.platform != 'mac' || matrix.arch != 'arm64'
        run: bun run build:electron
      - name: Verify native macOS build and installation
        if: matrix.platform == 'mac' && matrix.arch == 'arm64'
        run: bun run mac
      - name: Decide Windows signing
        id: signing
        env:
          PLATFORM: ${{ matrix.platform }}
          PUBLISH: ${{ needs.prepare.outputs.publish }}
          SIGNPATH_TOKEN_SET: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
        run: node scripts/signpath-config.mjs
      - name: Build installers and checksums
        if: steps.signing.outputs.enabled != 'true'
        env:
          CSC_LINK: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ needs.prepare.outputs.publish == 'true' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          node scripts/prepare-electron-pack.mjs
          node scripts/build-ci-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      # SignPath (only when configured): sign the app exe, build the NSIS installer from the signed
      # app, sign the installer, then collect. Hashes are computed after signing.
      - name: Build unpacked Windows app for signing
        if: steps.signing.outputs.enabled == 'true'
        run: |
          node scripts/prepare-electron-pack.mjs
          node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=unpacked
      - name: Upload unsigned Windows app exe
        id: upload-unsigned-app
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-app-win-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-signpath/app/
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows app exe with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ steps.signing.outputs.organizationId }}
          project-slug: ${{ steps.signing.outputs.projectSlug }}
          signing-policy-slug: ${{ steps.signing.outputs.signingPolicySlug }}
          artifact-configuration-slug: ${{ steps.signing.outputs.appArtifactConfigurationSlug }}
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signpath/app-signed
      - name: Build Windows installer from signed app
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=installer
      - name: Upload unsigned Windows installer
        id: upload-unsigned-installer
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signpath-installer-win-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-signpath/installer/
          if-no-files-found: error
          retention-days: 1
      - name: Sign Windows installer with SignPath
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ steps.signing.outputs.organizationId }}
          project-slug: ${{ steps.signing.outputs.projectSlug }}
          signing-policy-slug: ${{ steps.signing.outputs.signingPolicySlug }}
          artifact-configuration-slug: ${{ steps.signing.outputs.installerArtifactConfigurationSlug }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist-signpath/installer-signed
      - name: Collect signed Windows installer and checksums
        if: steps.signing.outputs.enabled == 'true'
        run: node scripts/build-ci-installers.mjs win ${{ matrix.arch }} --stage=collect
      - name: Verify Arch package installs with dependencies
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD/dist-desktop/ci:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /packages/*.pacman
            pacman -Q goose-note-app
            test -f "/opt/Goose Note/resources/app.asar"
            test -x /usr/bin/goose-note-app
            # Every shared library the binary needs must come from the declared pacman depends.
            ! ldd "/opt/Goose Note/goose-note-app" | grep "not found"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goose-note-${{ matrix.platform }}-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: dist-desktop/ci/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release in source repository
    needs: [prepare, source, build]
    if: needs.prepare.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: goose-notes-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-artifacts/
      - name: Collect exact build assets for publication
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shutil
          sha = os.environ['SOURCE_SHA']
          dest = pathlib.Path('artifacts')
          dest.mkdir()
          for prefix in ('source', 'goose-note-win-x64', 'goose-note-win-arm64', 'goose-note-mac-arm64', 'goose-note-mac-x64', 'goose-note-linux-x64'):
              src = pathlib.Path('downloaded-artifacts') / f'{prefix}-{sha}'
              if not src.is_dir():
                  raise SystemExit(f'Missing artifact: {src}')
              for file in src.iterdir():
                  if not file.is_file():
                      raise SystemExit(f'Unexpected directory: {file}')
                  name = file.name.replace(' ', '.')
                  if name in {'SHA256SUMS.txt', 'BUILD.json', 'COMMIT.txt'}:
                      name = f'{prefix}-{name}'
                  target = dest / name
                  if target.exists() and target.read_bytes() != file.read_bytes():
                      raise SystemExit(f'Conflicting asset: {name}')
                  shutil.copyfile(file, target)
          PYTHON
      - name: Publish installers, source and update feeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs
