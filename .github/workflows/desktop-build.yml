name: Desktop installers

on:
  schedule:
    # ponytail: GitHub cron 按月中日期隔日运行；月底可能连续两天，严格 48 小时需每日轻量检查。
    - cron: '0 7 */2 * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare staging release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.staging.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Skip unchanged scheduled builds
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            latest=$(gh release view --repo eachann1024/goose-note-app --json tagName --jq .tagName)
            if [[ "$latest" == *"-${GITHUB_SHA:0:7}" ]]; then
              echo 'publish=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo 'publish=true' >> "$GITHUB_OUTPUT"
      - name: Create staging draft
        id: staging
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ci-${GITHUB_RUN_ID}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "构建暂存 ${GITHUB_SHA:0:7}" --notes "内部暂存，构建完成后删除。" --prerelease --latest=false

  source:
    name: Source archive
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --prefix=goose-note-source/ HEAD > source-artifact/goose-note-source-${GITHUB_SHA}.tar.gz
          printf '%s\n' "$GITHUB_SHA" > source-artifact/COMMIT.txt
          cp BUILD-ARTIFACTS.md LICENSE SOURCE-CODE.md THIRD-PARTY-NOTICES.txt source-artifact/
          cd source-artifact
          sha256sum *.tar.gz > source-${GITHUB_SHA}-SHA256SUMS.txt
      - name: Upload source to staging release
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$STAGE_TAG" source-artifact/* --clobber

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    needs: [prepare]
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-2022
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Compile renderer, main and preload
        run: bun run build:electron
      - name: Build installers and checksums
        run: node scripts/build-ci-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify Arch package installs with dependencies
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD/dist-desktop/ci:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /packages/*.pacman
            pacman -Q goose-note-app
            test -f "/opt/Goose Note/resources/app.asar"
          '
      - name: Upload installers to staging release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ needs.prepare.outputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          PYTHON=python3
          command -v python3 >/dev/null || PYTHON=python
          "$PYTHON" - <<'PY'
          import os, shutil, pathlib
          src = pathlib.Path('dist-desktop/ci')
          dest = pathlib.Path('staging-upload')
          dest.mkdir()
          prefix = f"goose-note-{os.environ['PLATFORM']}-{os.environ['ARCH']}"
          for file in src.iterdir():
              if not file.is_file():
                  continue
              name = file.name.replace(' ', '.')
              if name in {'SHA256SUMS.txt', 'BUILD.json', 'COMMIT.txt'}:
                  name = f"{prefix}-{name}"
              shutil.copyfile(file, dest / name)
          files = list(dest.iterdir())
          if not files:
              raise SystemExit('No installer files to upload')
          print('\n'.join(file.name for file in files))
          PY
          gh release upload "$STAGE_TAG" staging-upload/* --clobber

  release:
    name: Publish development release
    needs: [prepare, source, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download staging assets
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p artifacts/staging
          gh release download "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts/staging
      - name: Verify and prepare release assets
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, shutil, hashlib
          staging = pathlib.Path('artifacts/staging')
          out = pathlib.Path('release-assets')
          out.mkdir()
          checksum_names = {'SHA256SUMS.txt'}
          for file in staging.iterdir():
              if not file.is_file():
                  continue
              if file.name in checksum_names or file.name.endswith('-SHA256SUMS.txt'):
                  continue
              target = out / file.name.replace(' ', '.')
              if target.exists():
                  raise RuntimeError('Duplicate asset: ' + target.name)
              shutil.copyfile(file, target)
          (out / 'SHA256SUMS.txt').write_text(''.join(
              hashlib.sha256(file.read_bytes()).hexdigest() + '  ' + file.name + '\n'
              for file in sorted(out.iterdir())
          ))
          PY
      - name: Publish complete prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF_NOTES
          自动开发构建，提交：${GITHUB_SHA}

          Windows x64：exe；macOS Apple Silicon：arm64.dmg，Intel：无 arm64 后缀的 dmg；Linux x64：AppImage / deb / rpm；Arch Linux：pacman。

          签名与公证状态见各平台 BUILD.json。已通过多平台打包和 Arch 容器安装检查，未代替各平台桌面功能验收。
          附对应项目源码归档、构建记录与 SHA256SUMS.txt。依赖源码及第三方声明的公开分发核对事项见随附 SOURCE-CODE 文档。

          构建记录：https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF_NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "开发构建 ${GITHUB_SHA:0:7}" --notes-file release-notes.md --prerelease --draft --latest=false
          gh release upload "$tag" release-assets/*
          gh release edit "$tag" --draft=false

  publish-public:
    name: Publish public release
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: public-app-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download staging installers
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts
      - name: Publish to public repository
        env:
          PUBLIC_APP_TOKEN: ${{ secrets.PUBLIC_APP_TOKEN }}
          PUBLIC_APP_REPO: eachann1024/goose-note-app
        run: node scripts/publish-public-app.mjs

  cleanup-staging:
    name: Delete staging release
    needs: [prepare, release, publish-public]
    if: github.ref == 'refs/heads/main' && needs.release.result == 'success' && needs.publish-public.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete staging draft
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release delete "$STAGE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
