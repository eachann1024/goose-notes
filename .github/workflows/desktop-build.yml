name: Desktop installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          mkdir source-artifact
          git archive --format=tar.gz --prefix=goose-note-source/ HEAD > source-artifact/goose-note-source-${GITHUB_SHA}.tar.gz
          printf '%s\n' "$GITHUB_SHA" > source-artifact/COMMIT.txt
          cp BUILD-ARTIFACTS.md LICENSE SOURCE-CODE.md THIRD-PARTY-NOTICES.txt source-artifact/
          cd source-artifact
          sha256sum *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-${{ github.sha }}
          path: source-artifact/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            arch: x64
            runner: windows-2022
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: linux
            arch: x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Compile renderer, main and preload
        run: bun run build:electron
      - name: Build unsigned installers and checksums
        run: node scripts/build-ci-installers.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Verify Arch package installs with dependencies
        if: matrix.platform == 'linux'
        run: |
          docker run --rm -v "$PWD/dist-desktop/ci:/packages:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm
            pacman -U --noconfirm /packages/*.pacman
            pacman -Q goose-note-app
            test -f "/opt/Goose Note/resources/app.asar"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goose-note-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: dist-desktop/ci/
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
