name: Goose native macOS preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/goose-native-preview/**'
      - '.github/workflows/goose-native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goose-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    if: github.repository == 'eachann1024/goose-notes' && github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 15
    env:
      EXPECTED_RECORDER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOOSE_SHA: fab53195d172c6ae008c8da9fe4d32716eba550a
      GOOSE_SOURCE: ${{ github.workspace }}/goose-source
      GOOSE_OUT: ${{ github.workspace }}/goose-native-out
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/goose-source/.ci-playwright
    steps:
      - name: Checkout exact recorder revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_RECORDER_SHA }}
          persist-credentials: false
      - name: Checkout exact application source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.GOOSE_SHA }}
          path: goose-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'
      - name: Initialize evidence and validate the recorder
        run: |
          set -euo pipefail
          node .github/goose-native-preview/record.mjs init
          node --test .github/goose-native-preview/record.test.mjs 2>&1 | tee "$GOOSE_OUT/helper-tests.log"
          sw_vers > "$GOOSE_OUT/platform.txt"
          uname -m >> "$GOOSE_OUT/platform.txt"
      - name: Install locked runtime dependencies without building the app
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node .github/goose-native-preview/record.mjs stage dependencies running
          npm install --prefix "$RUNNER_TEMP/bun-tool" --no-audit --no-fund bun@1.3.14
          echo "$RUNNER_TEMP/bun-tool/node_modules/.bin" >> "$GITHUB_PATH"
          cd "$GOOSE_SOURCE"
          "$RUNNER_TEMP/bun-tool/node_modules/.bin/bun" install --frozen-lockfile 2>&1 | tee "$GOOSE_OUT/dependencies.log"
          node node_modules/electron/install.js 2>&1 | tee -a "$GOOSE_OUT/dependencies.log"
          node node_modules/playwright/cli.js install ffmpeg 2>&1 | tee -a "$GOOSE_OUT/dependencies.log"
          node -p 'JSON.stringify({node:process.version,electron:require("electron/package.json").version,playwright:require("playwright/package.json").version})' | tee -a "$GOOSE_OUT/dependencies.log"
          cd "$GITHUB_WORKSPACE"
          node .github/goose-native-preview/record.mjs stage dependencies passed
      - name: Native Electron runtime preflight before a full build
        timeout-minutes: 2
        run: |
          set -euo pipefail
          node .github/goose-native-preview/record.mjs runtime preflight 2>&1 | tee "$GOOSE_OUT/preflight.log"
      - name: Build the native macOS app only after runtime preflight
        timeout-minutes: 8
        run: |
          set -euo pipefail
          test ! -e '/Applications/Goose Note.app'
          node .github/goose-native-preview/record.mjs stage build running
          cd "$GOOSE_SOURCE"
          bun run mac 2>&1 | tee "$GOOSE_OUT/build.log"
          bun run typecheck 2>&1 | tee "$GOOSE_OUT/typecheck.log"
          cd "$GITHUB_WORKSPACE"
          node .github/goose-native-preview/record.mjs verify-source
          node .github/goose-native-preview/record.mjs stage build passed
      - name: Record the real installed app with synthetic notes
        timeout-minutes: 5
        run: |
          set -euo pipefail
          node .github/goose-native-preview/record.mjs runtime record 2>&1 | tee "$GOOSE_OUT/recorder.log"
      - name: Preserve truthful status and evidence
        if: always()
        env:
          PREVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          if [ -f "$GOOSE_OUT/manifest.json" ]; then
            node .github/goose-native-preview/record.mjs finalize "$PREVIEW_JOB_STATUS"
          fi
      - name: Retain synthetic public review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: goose-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GOOSE_OUT }}
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: false
