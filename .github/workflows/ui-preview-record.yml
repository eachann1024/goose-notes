name: UI preview recorder
on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      plan-artifact:
        required: true
        type: string
      output-artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: ci
          sparse-checkout: .github/ui-preview
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: pr
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix ci/.github/ui-preview --ignore-scripts
      - run: bun install --frozen-lockfile
        working-directory: pr
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-noto-color-emoji
      - run: node ci/.github/ui-preview/node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.plan-artifact }}
          path: plan
      - name: Build PR, execute planned interactions and capture media (no secrets)
        run: node ci/.github/ui-preview/run.mjs record pr out plan/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.output-artifact }}
          path: out
          retention-days: 7
          if-no-files-found: error
