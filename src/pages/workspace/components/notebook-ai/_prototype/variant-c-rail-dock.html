<!DOCTYPE html>
<!--
PROTOTYPE / 方案 C 侧轨墨色
问题：AI 顶栏和滚到底部如何贴合白色笔记？
本变体：取消顶栏；标题叠在内容上；操作为右侧竖轨；滚到底部贴在输入框上方。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE · C 侧轨墨色</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: #171717;
    background: #d9d9de;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ===== 800×800 外壳 ===== */
  .window {
    width: 800px;
    height: 800px;
    background: #f3f3f5;
    border-radius: 12px;
    box-shadow: 0 24px 60px rgba(0,0,0,.18);
    display: flex;
    overflow: hidden;
  }

  /* ===== 左侧窄侧栏 ===== */
  .sidebar {
    width: 200px;
    flex: none;
    padding: 16px 12px;
    border-right: 1px solid #e5e5e5;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .sidebar .brand {
    font-size: 13px;
    font-weight: 600;
    padding: 6px 8px 12px;
  }
  .sb-item {
    font-size: 13px;
    color: #525252;
    padding: 6px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sb-item.active { background: #e9e9ec; color: #171717; font-weight: 500; }
  .sb-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #a3a3a3; }

  /* ===== 中间露出的白色笔记 ===== */
  .note {
    flex: 1;
    background: #ffffff;
    margin: 24px 0 24px 0;
    border-radius: 10px 0 0 10px;
    border: 1px solid #e5e5e5;
    border-right: none;
    padding: 28px 24px;
    overflow: hidden;
  }
  .note h1 { font-size: 20px; font-weight: 700; margin-bottom: 14px; }
  .note p { font-size: 13px; color: #737373; line-height: 1.9; margin-bottom: 10px; }
  .note .line { height: 9px; border-radius: 4px; background: #f0f0f2; margin-bottom: 10px; }
  .note .line.w80 { width: 80%; }
  .note .line.w60 { width: 60%; }
  .note .line.w90 { width: 90%; }

  /* ===== 右侧 AI 面板 ===== */
  .ai-panel {
    width: 360px;
    flex: none;
    background: #ffffff;
    border-left: 1px solid #e5e5e5;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* 消息区（标题叠在其顶部，透明底） */
  .messages {
    flex: 1;
    overflow-y: auto;
    background: #f5f5f7;
    padding: 18px 40px 16px 16px; /* 右侧留出竖轨空间 */
  }

  /* 叠在内容上的面包屑小标题 */
  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #171717;
    background: transparent;
    margin-bottom: 4px;
  }
  .crumb .doc-ico {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .crumb .title { font-weight: 600; }
  .crumb .sep { color: #a3a3a3; }
  .crumb .sub { color: #737373; font-size: 12px; }
  .crumb .proto-tag {
    margin-left: auto;
    font-size: 10px;
    letter-spacing: .04em;
    color: #a3a3a3;
    border: 1px solid #e5e5e5;
    background: #ffffff;
    border-radius: 999px;
    padding: 2px 8px;
  }

  /* 右侧竖轨 */
  .rail {
    position: absolute;
    top: 14px;
    right: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }
  .rail button {
    width: 28px; height: 28px;
    border-radius: 7px;
    border: 1px solid #e5e5e5;
    background: #ffffff;
    color: #525252;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .rail button:hover { background: #f5f5f5; color: #171717; }

  /* 消息气泡 */
  .msg { margin-top: 14px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px 12px 4px 12px;
    padding: 8px 12px;
    font-size: 13px;
    max-width: 85%;
  }
  .msg.assistant .meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: #a3a3a3; margin-bottom: 6px;
  }
  .msg.assistant .meta .spark { color: #262626; font-size: 12px; }
  .msg.assistant .bubble {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 4px 12px 12px 12px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.8;
    color: #262626;
  }
  .msg.assistant .bubble strong { color: #171717; }

  /* composer 组：滚底芯片 + 输入框 = 同一组白块 */
  .composer-zone {
    background: #f5f5f7;
    padding: 0 12px 12px;
  }
  .scroll-chip {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    width: max-content;
    margin: 0 auto;
    position: relative;
    top: 1px; /* 与下方白块相接 */
    font-size: 11px;
    color: #525252;
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    padding: 4px 12px 5px;
  }
  .composer {
    background: #ffffff;
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 10px 12px;
  }
  .composer .placeholder {
    font-size: 13px;
    color: #a3a3a3;
    min-height: 34px;
  }
  .composer .foot {
    display: flex;
    align-items: center;
    margin-top: 6px;
  }
  .composer .model {
    font-size: 11px;
    color: #737373;
    display: flex; align-items: center; gap: 5px;
  }
  .composer .model .spark { color: #262626; }
  .composer .send {
    margin-left: auto;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #171717;
    color: #ffffff;
    border: none;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="window">
    <!-- 左侧窄侧栏 -->
    <aside class="sidebar">
      <div class="brand">鹅的笔记</div>
      <div class="sb-item active"><span class="dot"></span>AI 功能演示</div>
      <div class="sb-item"><span class="dot"></span>周报草稿</div>
      <div class="sb-item"><span class="dot"></span>读书清单</div>
      <div class="sb-item"><span class="dot"></span>灵感速记</div>
    </aside>

    <!-- 中间露出的白色笔记 -->
    <main class="note">
      <h1>AI 功能演示</h1>
      <p>这是一篇用于演示 AI 面板形态的笔记正文，保持纯白编辑面。</p>
      <div class="line w90"></div>
      <div class="line w80"></div>
      <div class="line w60"></div>
      <div class="line w90"></div>
      <div class="line w80"></div>
    </main>

    <!-- 右侧 AI 面板：无顶栏 -->
    <section class="ai-panel">
      <!-- 右侧竖轨操作 -->
      <div class="rail">
        <button title="新对话">＋</button>
        <button title="更多">⋯</button>
        <button title="关闭">×</button>
      </div>

      <!-- 消息区，标题叠在顶部 -->
      <div class="messages">
        <div class="crumb">
          <span class="doc-ico">📄</span>
          <span class="title">AI 功能演示</span>
          <span class="sep">/</span>
          <span class="sub">AI 对话</span>
          <span class="proto-tag">PROTOTYPE · C 侧轨墨色</span>
        </div>

        <div class="msg user">
          <div class="bubble">不对 写的太啰嗦了</div>
        </div>

        <div class="msg assistant">
          <div class="meta"><span class="spark">✦</span>AI 助手</div>
          <div class="bubble">
            <strong>鹅的笔记 AI：把笔记变成可执行工作台</strong><br>
            好的，我收敛一下。核心就三点：<br>
            1. 选中即问：划线唤起 AI，就地改写、扩写、翻译；<br>
            2. 全文理解：基于当前笔记回答，不瞎编；<br>
            3. 一键落笔：结果直接插回正文，保留格式。<br>
            要我再压成一句话版本吗？
          </div>
        </div>
      </div>

      <!-- composer 组：滚底芯片贴在输入框上方 -->
      <div class="composer-zone">
        <div class="scroll-chip">↓ 最新</div>
        <div class="composer">
          <div class="placeholder">向 AI 提问，或输入 / 使用技能…</div>
          <div class="foot">
            <span class="model"><span class="spark">✦</span>GPT-5 · 自动</span>
            <button class="send" title="发送">↑</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
