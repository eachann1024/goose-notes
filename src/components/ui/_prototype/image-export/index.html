<!DOCTYPE html>
<!-- PROTOTYPE switcher：仅用于对比三个设计稿，勿进生产。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型切换器 — 图片导出主题</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  iframe {
    display: block;
    width: 100vw;
    height: 100vh;
    border: 0;
  }
  .switcher {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: #111;
    color: #fff;
    border: 2px solid #fff;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    font: 600 14px/1 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .switcher button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid #fff;
    background: transparent;
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .switcher button:hover {
    background: #fff;
    color: #111;
  }
  .switcher .label {
    min-width: 220px;
    text-align: center;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<iframe id="frame" title="设计稿预览"></iframe>

<div class="switcher" role="group" aria-label="设计稿切换">
  <button id="prev" type="button" aria-label="上一个设计稿">←</button>
  <span class="label" id="label"></span>
  <button id="next" type="button" aria-label="下一个设计稿">→</button>
</div>

<script>
  var VARIANTS = [
    { key: 'A', file: 'variant-a-split-preview.html', label: 'A — 宽屏左预览（生产）' },
    { key: 'B', file: 'variant-b-hero-card.html', label: 'B — 网格首张大卡' },
    { key: 'C', file: 'variant-c-top-strip.html', label: 'C — 顶部预览条' }
  ];

  var frame = document.getElementById('frame');
  var label = document.getElementById('label');

  function currentIndex() {
    var key = new URLSearchParams(location.search).get('variant');
    var i = VARIANTS.findIndex(function (v) { return v.key === key; });
    return i === -1 ? 0 : i;
  }

  function render() {
    var v = VARIANTS[currentIndex()];
    if (!frame.src.endsWith(v.file)) frame.src = v.file;
    label.textContent = v.label;
    document.title = '原型切换器 — ' + v.label;
  }

  function go(delta) {
    var i = (currentIndex() + delta + VARIANTS.length) % VARIANTS.length;
    var params = new URLSearchParams(location.search);
    params.set('variant', VARIANTS[i].key);
    history.pushState(null, '', location.pathname + '?' + params.toString());
    render();
  }

  document.getElementById('prev').addEventListener('click', function () { go(-1); });
  document.getElementById('next').addEventListener('click', function () { go(1); });
  window.addEventListener('popstate', render);

  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
  });

  render();
</script>
</body>
</html>
